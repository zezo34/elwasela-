<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>المعمل الرقمي — Digital Lab</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f4fb;--ink:#1b1f3b;--mut:#5b6288;--card:#fff;--line:#e1e5f4;--pri:#4f46e5;--pri2:#7c3aed;--pk:#ff5d8f;--mint:#10b981;--ylw:#f5b50a;--red:#ef4444;--blue:#1a73e8;--sh:0 10px 30px #2a2f6b14;--r:22px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Tajawal',Tahoma,Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.85;font-size:17px;min-height:100vh}
body[dir=ltr]{line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
h1,h2,h3{margin:0;line-height:1.4}
p{margin:8px 0}
.top{position:sticky;top:0;z-index:60;background:#ffffffe6;backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top .in{display:flex;align-items:center;gap:12px;padding:8px 16px;max-width:1200px;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.brand img{height:42px;width:42px;object-fit:contain;border-radius:10px;border:1px solid var(--line);background:#fff;padding:2px}
.brand b{font-weight:900;font-size:19px}
.lang{margin-inline-start:auto;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:99px;padding:6px 18px;font-weight:800;box-shadow:0 6px 16px #4f46e555}
.rail{position:fixed;top:59px;bottom:0;inset-inline-start:0;width:84px;background:#fff;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:4px;padding:10px 6px;overflow-y:auto;z-index:50}
.rail button{background:none;border:0;border-radius:16px;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:0;font-size:12px;font-weight:700;color:var(--mut);line-height:1.3;transition:.2s}
.rail button .ic{font-size:26px;width:46px;height:40px;display:grid;place-items:center;border-radius:14px;background:var(--bg);transition:.2s}
.rail button:hover .ic{transform:translateY(-2px)}
.rail button.on{color:var(--ink)}
.rail button.on .ic{background:var(--c,var(--pri));box-shadow:0 8px 18px color-mix(in srgb,var(--c,var(--pri)) 40%,transparent);filter:none}
main{margin-inline-start:84px;padding:22px 20px 70px;max-width:1180px}
@media(min-width:1380px){main{margin-inline:auto;padding-inline-start:104px}}
@media(max-width:820px){
 .rail{top:auto;bottom:0;inset-inline:0;width:auto;flex-direction:row;border-inline-end:0;border-top:1px solid var(--line);padding:4px 6px;overflow-x:auto;overflow-y:hidden}
 .rail button{flex:none;min-width:62px}
 .rail button .ic{width:38px;height:34px;font-size:22px}
 main{margin-inline-start:0;padding:16px 14px 100px}
 .brand b{display:none}
}
.view{display:none;animation:in .35s}
.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1}}
.tag{display:inline-block;border-radius:99px;padding:1px 14px;font-weight:800;font-size:14px;color:#fff;background:var(--c,var(--pri))}
h1{font-size:clamp(26px,4vw,40px);font-weight:900;margin:6px 0 4px}
.sub{color:var(--mut);margin:0 0 6px}
h2{font-size:23px;font-weight:900;margin:34px 0 8px;display:flex;align-items:center;gap:10px}
h2 .n{background:var(--c,var(--pri));color:#fff;width:34px;height:34px;border-radius:12px;display:grid;place-items:center;font-size:17px;flex:none}
h3{font-size:18px;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin:12px 0}
.goals{background:linear-gradient(135deg,#fff7e0,#fff);border-inline-start:6px solid var(--ylw)}
.goals ul{margin:6px 0 0;padding-inline-start:22px}
.goals li{margin:3px 0}
.hint{background:#eef2ff;border:1px dashed #a5b4fc;border-radius:14px;padding:8px 14px;margin:10px 0;color:#3730a3}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:900px){.grid2,.grid3{grid-template-columns:1fr}}
.btn{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border:0;border-radius:14px;padding:9px 20px;font-weight:800;box-shadow:0 6px 16px #4f46e540;transition:.15s}
.btn:hover{transform:translateY(-1px)}
.btn.gh{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.sm{padding:5px 14px;border-radius:10px;font-size:15px}
.btn.red{background:var(--red);box-shadow:0 6px 16px #ef444440}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.chip{background:#fff;border:1.5px solid var(--line);border-radius:99px;padding:4px 14px;font-weight:700;font-size:15px;transition:.15s}
.chip:hover{border-color:var(--pri)}
.chip.on{background:var(--c,var(--pri));border-color:var(--c,var(--pri));color:#fff}
input[type=text],input[type=number],input[type=date],select,textarea{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:5px 10px;width:100%;min-width:0}
input:focus,select:focus,textarea:focus{outline:2px solid #a5b4fc;border-color:var(--pri)}
.pill{display:inline-block;background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:0 12px;font-weight:800;font-size:15px}
.ok{color:#047857;font-weight:800}.no{color:#b91c1c;font-weight:800}
.shake{animation:sh .35s}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bar{height:10px;background:#e9ecf8;border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--mint),var(--pri));width:0;transition:.5s}
/* home */
.hero{background:linear-gradient(135deg,#4f46e5,#7c3aed 55%,#ff5d8f);color:#fff;border-radius:30px;padding:28px 26px;position:relative;overflow:hidden;box-shadow:0 20px 50px #4f46e544}
.hero:before{content:"";position:absolute;inset-inline-end:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:#ffffff1f}
.hero:after{content:"";position:absolute;inset-inline-start:-40px;bottom:-80px;width:220px;height:220px;border-radius:50%;background:#ffffff14}
.hero h1{color:#fff;position:relative}
.hero p{position:relative;max-width:640px;opacity:.95}
.creds{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#ffffff26;border:1px solid #ffffff55;border-radius:20px;padding:12px 16px;margin-top:14px;position:relative}
.creds .lg{display:flex;gap:8px;align-items:center}
.creds .lg img{height:64px;width:64px;object-fit:contain;background:#fff;border-radius:14px;padding:3px}
.creds .lg img.sch{width:auto;height:64px;max-width:150px;object-fit:cover;padding:0}
.creds small{display:block;font-weight:700;opacity:.85}
.creds b{font-size:18px;font-weight:900}
.launch{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:22px}
@media(max-width:900px){.launch{grid-template-columns:repeat(2,1fr)}}
.app{background:#fff;border:1px solid var(--line);border-radius:26px;padding:16px 14px;text-align:center;box-shadow:var(--sh);transition:.2s;display:flex;flex-direction:column;align-items:center;gap:4px}
.app:hover{transform:translateY(-6px) rotate(-1deg)}
.app .ic{width:68px;height:68px;border-radius:22px;background:var(--c);display:grid;place-items:center;font-size:34px;box-shadow:0 10px 20px color-mix(in srgb,var(--c) 40%,transparent)}
.app b{font-size:17px;font-weight:900}
.app span{color:var(--mut);font-size:14px;line-height:1.5}
/* lessons */
.concept{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
@media(max-width:900px){.concept{grid-template-columns:1fr}}
.concept .card{margin:0}
.concept h3{color:var(--c)}
.concept ul{margin:4px 0 0;padding-inline-start:20px}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:700px){.cards3{grid-template-columns:repeat(2,1fr)}}
.mini{background:#fff;border:1.5px solid var(--line);border-radius:18px;padding:10px;text-align:center;transition:.2s}
.mini:hover{border-color:var(--c,var(--pri));transform:translateY(-3px)}
.mini.on{background:var(--c,var(--pri));color:#fff;border-color:var(--c,var(--pri))}
.mini .e{font-size:30px;display:block}
.mini b{font-size:15px}
/* video */
.vid{border-radius:24px;overflow:hidden;background:#0f1235;color:#fff;box-shadow:var(--sh)}
.stage{position:relative;aspect-ratio:16/8.5;min-height:230px;background:radial-gradient(circle at 20% 20%,color-mix(in srgb,var(--c) 70%,#0f1235),#0f1235 70%);display:grid;place-items:center;text-align:center;padding:14px 18px;overflow:hidden}
.stage .big{font-size:76px;animation:bob 2.2s ease-in-out infinite;filter:drop-shadow(0 10px 18px #0006)}
@keyframes bob{50%{transform:translateY(-10px) scale(1.05)}}
.stage h3{color:#fff;font-size:24px;margin-top:2px}
.stage .cap{background:#0009;border-radius:12px;padding:4px 14px;margin-top:8px;font-size:17px;max-width:720px;min-height:34px}
.stage .orb{position:absolute;border-radius:50%;background:#ffffff12;animation:fl 8s linear infinite}
@keyframes fl{from{transform:translateY(20px)}to{transform:translateY(-30px)}}
.stage .sc{position:absolute;top:8px;inset-inline-end:12px;background:#0007;border-radius:99px;padding:0 12px;font-size:14px;font-weight:800}
.vctl{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#161a47}
.vctl button{background:#ffffff1f;border:0;border-radius:50%;width:38px;height:38px;color:#fff;font-size:16px}
.vctl button.t{width:auto;border-radius:99px;padding:0 14px;font-size:14px;font-weight:800}
.vbar{flex:1;height:8px;background:#ffffff2a;border-radius:99px;cursor:pointer;position:relative}
.vbar i{position:absolute;inset-block:0;inset-inline-start:0;background:linear-gradient(90deg,#34d399,#60a5fa);border-radius:99px;width:0}
.vlink{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
/* meet */
.meet{background:#202124;border-radius:20px;padding:10px;color:#fff;position:relative;overflow:hidden}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
@media(max-width:560px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.tile{background:#3c4043;border-radius:14px;aspect-ratio:16/10;display:grid;place-items:center;position:relative;font-weight:800}
.tile .av{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-size:20px;color:#fff}
.tile .nm{position:absolute;bottom:6px;inset-inline-start:8px;font-size:12px;background:#0008;border-radius:8px;padding:0 8px}
.tile .mu{position:absolute;top:6px;inset-inline-end:6px;font-size:14px}
.tile.sp{outline:3px solid #34a853}
.mpres{background:#fff;color:#222;border-radius:14px;padding:16px;text-align:center;min-height:140px;display:grid;place-items:center}
.mbar{display:flex;justify-content:center;gap:8px;margin-top:10px;flex-wrap:wrap}
.mbar button{width:48px;height:48px;border-radius:50%;border:0;background:#3c4043;color:#fff;font-size:20px;transition:.15s;position:relative}
.mbar button.off{background:#ea4335}
.mbar button.act{background:#8ab4f8;color:#202124}
.mbar button.end{background:#ea4335;width:66px;border-radius:99px}
.mchat{background:#fff;color:#222;border-radius:14px;margin-top:10px;padding:8px 12px}
.mchat .m{margin:4px 0;font-size:15px}.mchat .m b{color:var(--blue)}
.mcc{background:#000b;border-radius:10px;padding:3px 12px;text-align:center;margin-top:8px;font-size:15px}
/* order */
.slots{display:grid;gap:6px;margin:8px 0}
.slot{border:2px dashed var(--line);border-radius:12px;padding:5px 12px;min-height:40px;display:flex;gap:8px;align-items:center}
.slot.f{border-style:solid;border-color:var(--mint);background:#ecfdf5}
.slot i{font-style:normal;background:var(--c,var(--pri));color:#fff;border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-weight:900;flex:none;font-size:14px}
.seq{display:flex;flex-wrap:wrap;gap:8px}
.seq button{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:6px 12px;text-align:start;font-weight:600}
.seq button.used{opacity:.3;pointer-events:none}
/* quiz */
.opts{display:grid;gap:8px;margin:10px 0}
.opts button{text-align:start;background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:9px 14px;font-weight:600;transition:.15s}
.opts button:hover:not(:disabled){border-color:var(--pri);background:#eef2ff}
.opts button.ok{background:#d1fae5;border-color:var(--mint);color:#064e3b}
.opts button.no{background:#fee2e2;border-color:var(--red);color:#7f1d1d}
.res{text-align:center;padding:14px}
.res .st{font-size:44px;letter-spacing:6px}
/* tables */
.tw{overflow-x:auto;border:1.5px solid var(--line);border-radius:14px;background:#fff}
table.t{border-collapse:collapse;width:100%;font-size:15px}
table.t th{background:#a4373a;color:#fff;padding:6px 10px;text-align:start;white-space:nowrap;font-weight:800}
table.t.q th{background:#d97706}
table.t td{border-top:1px solid var(--line);padding:3px 8px;white-space:nowrap}
table.t tr:nth-child(even) td{background:#faf7f7}
table.t td input,table.t td select{padding:2px 6px;border-radius:6px;border-width:1px}
.acc{font-weight:800;font-size:13px;background:#a4373a;color:#fff;border-radius:8px;padding:0 10px;display:inline-block}
.tabsx{display:flex;gap:4px;margin-bottom:8px}
.tabsx button{background:#fff;border:1.5px solid var(--line);border-radius:12px 12px 0 0;padding:4px 16px;font-weight:800;font-size:15px}
.tabsx button.on{background:#a4373a;color:#fff;border-color:#a4373a}
.sql{font-family:Consolas,monospace;direction:ltr;text-align:left;background:#0f172a;color:#a5f3fc;border-radius:12px;padding:8px 14px;font-size:14px;white-space:pre-wrap;margin-top:8px}
/* form */
.frm{background:#fff;border:2px solid #a4373a;border-radius:16px;overflow:hidden}
.frm .hd{background:#a4373a;color:#fff;padding:6px 14px;font-weight:800}
.frm .bd{padding:10px 16px;display:grid;gap:6px}
.frm label{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:center;font-weight:700}
.frm .nv{background:#f5eaea;padding:6px 10px;display:flex;gap:6px;align-items:center;justify-content:center;flex-wrap:wrap}
.frm .nv button{background:#fff;border:1.5px solid #c98a8c;border-radius:8px;width:38px;height:32px;font-weight:800}
/* planner */
.ring{--p:0;width:110px;height:110px;border-radius:50%;background:conic-gradient(var(--mint) calc(var(--p)*1%),#e5e7f5 0);display:grid;place-items:center;flex:none}
.ring b{width:84px;height:84px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:22px}
.pcard{background:linear-gradient(135deg,#ecfdf5,#fff);border:2px solid var(--mint);border-radius:20px;padding:14px 16px}
.chk label{display:flex;gap:8px;align-items:center;padding:3px 0;font-weight:600}
.chk input{width:20px;height:20px;accent-color:var(--mint)}
input[type=range]{width:100%;accent-color:var(--pri)}
/* profile */
.flip{perspective:1000px;width:min(100%,430px);height:240px;margin:12px auto;cursor:pointer}
.flip .in{position:relative;width:100%;height:100%;transition:transform .7s;transform-style:preserve-3d}
.flip.on .in{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;border-radius:24px;backface-visibility:hidden;padding:20px;display:flex;flex-direction:column;justify-content:center;gap:6px;box-shadow:var(--sh);color:#fff}
.flip .f{background:linear-gradient(135deg,#0ea5e9,#4f46e5)}
.flip .b{background:linear-gradient(135deg,#7c3aed,#ff5d8f);transform:rotateY(180deg)}
.flip .f b{font-size:26px;font-weight:900}
.avatar{width:70px;height:70px;border-radius:22px;background:#ffffff33;display:grid;place-items:center;font-size:38px}
.sup{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:760px){.sup{grid-template-columns:1fr}}
.drc{background:#fff;border:2px solid var(--line);border-radius:26px;padding:20px;text-align:center;transition:.25s;cursor:pointer;box-shadow:var(--sh)}
.drc:hover{border-color:var(--c);transform:translateY(-4px)}
.drc .av{width:92px;height:92px;border-radius:50%;margin:0 auto 6px;background:var(--c);color:#fff;font-size:40px;display:grid;place-items:center;font-weight:900}
.drc .no1{display:inline-block;background:var(--ylw);color:#3b2a00;border-radius:99px;padding:0 12px;font-weight:900;font-size:14px}
.drc b{display:block;font-size:22px;font-weight:900;margin-top:4px}
.drc .more{max-height:0;overflow:hidden;transition:.4s;color:var(--mut)}
.drc.on .more{max-height:140px;margin-top:8px}
.logos{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;align-items:stretch}
.lgc{background:#fff;border:2px solid var(--line);border-radius:22px;padding:12px;text-align:center;width:200px;transition:.2s;cursor:pointer}
.lgc:hover{border-color:var(--pri);transform:translateY(-4px)}
.lgc img{height:110px;max-width:100%;object-fit:contain}
.lgc small{display:block;font-weight:700;margin-top:4px}
.foot{margin-top:40px;text-align:center;color:var(--mut);font-size:15px;border-top:1px solid var(--line);padding-top:16px}
.foot b{color:var(--ink)}
.toast{min-height:26px;font-weight:700}
.prof{display:grid;grid-template-columns:260px 1fr;gap:24px;align-items:center;background:linear-gradient(135deg,#fff,#eef7ff);border:1px solid var(--line);border-radius:30px;padding:20px;box-shadow:var(--sh);position:relative;overflow:hidden}
.prof:before{content:"";position:absolute;inset-inline-end:-50px;top:-50px;width:200px;height:200px;border-radius:50%;background:#0ea5e91f}
.prof .ph{position:relative;border-radius:26px;padding:6px;background:linear-gradient(135deg,#0ea5e9,#7c3aed,#ff5d8f);box-shadow:0 16px 36px #4f46e540;transform:rotate(-2deg);transition:.3s}
.prof .ph:hover{transform:rotate(0) scale(1.02)}
.prof .ph img{display:block;width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:21px}
.prof .ph .bd{position:absolute;bottom:-12px;inset-inline-start:50%;transform:translateX(-50%);background:#fff;border-radius:99px;padding:2px 14px;font-weight:900;font-size:14px;box-shadow:0 6px 14px #0002;white-space:nowrap}
.prof h2.nm{margin:6px 0 4px;display:block;font-size:30px}
.prof .facts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.prof .facts div{background:#fff;border:1px solid var(--line);border-radius:14px;padding:6px 12px;font-size:15px;transition:.2s}
.prof .facts div:hover{border-color:#0ea5e9;transform:translateY(-2px)}
.prof .facts small{display:block;color:var(--mut);font-weight:700;font-size:12px}
.prof .facts b{font-weight:800}
@media(max-width:760px){.prof{grid-template-columns:1fr;text-align:center}.prof .ph{max-width:260px;margin:0 auto 12px}.prof .facts{text-align:start}}

.opts button.sel{outline:3px solid var(--c,#4f46e5);outline-offset:2px}
</style>
</head>
<body dir="rtl">
<header class="top"><div class="in">
 <button class="brand" data-go="home"><img data-img="uni" alt="Ain Shams University"><b data-ar="المعمل الرقمي" data-en="Digital Lab"></b></button>
 <button class="lang" id="langBtn">English</button>
</div></header>
<nav class="rail" id="rail"></nav>
<main id="main">
 <section class="view on" id="v-home"></section>
 <section class="view" id="v-goals"></section>
 <section class="view" id="v-l7"></section>
 <section class="view" id="v-l8"></section>
 <section class="view" id="v-l9"></section>
 <section class="view" id="v-l10"></section>
 <section class="view" id="v-exam"></section>
 <section class="view" id="v-me"></section>
 <section class="view" id="v-sup"></section>
 <div class="foot" id="foot"></div>

l8:{no:8,ic:'🗃️',c:COL.l8,
 title:B('تصميم قواعد البيانات','Databases Design'),
 sub:B('Microsoft Access: الجداول والحقول والمفتاح الأساسي','Microsoft Access: tables, fields and the primary key'),
 goals:[B('تفرّق بين البيانات والمعلومات.','Differentiate between data and information.'),
  B('تُعرّف قاعدة البيانات وتذكر مميزاتها.','Define a database and state its advantages.'),
  B('تتعرف مكوّنات الجدول: السجل والحقل.','Identify the parts of a table: record and field.'),
  B('تنشئ جدولًا في Access من عرض Table Design وتحدد نوع بيانات كل حقل.','Create a table in Access using Table Design and set each field\'s data type.'),
  B('تحدد المفتاح الأساسي Primary Key وتنتقل إلى Datasheet View لإدخال السجلات.','Set the Primary Key and switch to Datasheet View to enter records.')],
 concepts:[
  {t:B('البيانات والمعلومات','Data vs Information'),l:[B('البيانات: حقائق خام (أرقام أو كلمات) لا معنى لها وحدها، مثل 85.','Data: raw facts (numbers or words) meaningless alone, e.g. 85.'),B('المعلومات: بيانات بعد معالجتها ولها معنى، مثل «درجة أحمد 85 وهو الأول».','Information: processed data with meaning, e.g. "Ahmed scored 85, first in class".')]},
  {t:B('قاعدة البيانات','What is a database?'),l:[B('مجموعة منظمة من البيانات المترابطة تُخزَّن في ملف واحد ويسهل البحث فيها وتعديلها.','An organized collection of related data stored in one file, easy to search and edit.'),B('برنامج Microsoft Access من مجموعة Office لإنشاء قواعد البيانات.','Microsoft Access (part of Office) is used to create databases.')]},
  {t:B('مميزات قواعد البيانات','Advantages'),l:[B('سرعة البحث والاسترجاع.','Fast searching and retrieval.'),B('تقليل تكرار البيانات.','Less duplicated data.'),B('أمان وحماية بكلمات مرور.','Security with passwords.'),B('إمكانية مشاركة البيانات بين عدة مستخدمين.','Data can be shared among many users.')]},
  {t:B('مكوّنات الجدول','Parts of a table'),l:[B('الحقل Field: عمود يحمل نوعًا واحدًا من البيانات (مثل الاسم).','Field: a column holding one kind of data (e.g. Name).'),B('السجل Record: صف يضم بيانات عنصر واحد (طالب واحد).','Record: a row with all data of one item (one student).'),B('المفتاح الأساسي: حقل لا تتكرر قيمته ويميّز كل سجل (مثل ID).','Primary Key: a field with unique values that identifies each record (e.g. ID).')]}],
 vid:{q:B('أساسيات قواعد البيانات في Access','Access database basics'),qe:'Microsoft Access tutorial for beginners create table',sc:[
  {e:'🔢',t:B('بيانات ومعلومات','Data & information'),c:B('البيانات حقائق خام، والمعلومات هي البيانات بعد معالجتها.','Data are raw facts; information is processed data.')},
  {e:'🗄️',t:B('ما هي قاعدة البيانات؟','What is a database?'),c:B('ملف منظم يخزن بيانات مترابطة ويسهّل البحث فيها.','An organized file that stores related data and makes it searchable.')},
  {e:'🧱',t:B('الجدول والحقول والسجلات','Table, fields, records'),c:B('الحقول أعمدة، والسجلات صفوف.','Fields are columns, records are rows.')},
  {e:'📐',t:B('Table Design','Table Design'),c:B('اكتب أسماء الحقول واختر نوع بيانات كل حقل.','Type the field names and choose each field\'s data type.')},
  {e:'🔑',t:B('المفتاح الأساسي','Primary Key'),c:B('اجعل ID مفتاحًا أساسيًّا لتمييز كل سجل ثم انتقل إلى Datasheet View.','Make ID the primary key to identify each record, then go to Datasheet View.')}]},
 order:{h:B('رتّب خطوات إنشاء جدول في Access','Order the steps to create a table in Access'),steps:[B('افتح Access وأنشئ قاعدة بيانات فارغة','Open Access and create a blank database'),B('من تبويب Create اختر Table Design','From the Create tab choose Table Design'),B('اكتب أسماء الحقول واختر نوع كل حقل','Type field names and choose each data type'),B('حدد المفتاح الأساسي Primary Key','Set the Primary Key'),B('احفظ الجدول واكتب له اسمًا','Save the table and name it'),B('انتقل إلى Datasheet View وأدخل السجلات','Switch to Datasheet View and enter records')]},
 mini:{h:B('اختر نوع البيانات المناسب لكل حقل','Choose the right data type for each field'),qs:[
  {q:B('الحقل: اسم الطالب','Field: Student name'),o:[B('Short Text','Short Text'),B('Number','Number'),B('Yes/No','Yes/No'),B('Currency','Currency')],a:0,e:B('الأسماء نصوص فنختار Short Text.','Names are text, so Short Text.')},
  {q:B('الحقل: العمر','Field: Age'),o:[B('Short Text','Short Text'),B('Number','Number'),B('Date/Time','Date/Time'),B('AutoNumber','AutoNumber')],a:1,e:B('العمر قيمة عددية فنختار Number.','Age is numeric, so Number.')},

  {q:B('الحقل: ناجح؟ (نعم/لا)','Field: Passed? (yes/no)'),o:[B('Yes/No','Yes/No'),B('Currency','Currency'),B('Number','Number'),B('Short Text','Short Text')],a:0,e:B('القيمتان نعم/لا تناسبهما Yes/No.','Two-state values suit Yes/No.')},
  {q:B('الحقل: رقم الطالب الذي يزيد تلقائيًّا 1 و2 و3...','Field: student ID that increases automatically 1, 2, 3…'),o:[B('AutoNumber','AutoNumber'),B('Number','Number'),B('Short Text','Short Text'),B('Date/Time','Date/Time')],a:0,e:B('AutoNumber يعطي رقمًا متسلسلًا تلقائيًّا ويصلح مفتاحًا أساسيًّا.','AutoNumber gives sequential numbers automatically and suits a primary key.')}]},
 quiz:[
  {q:B('الحقائق الخام التي لا معنى لها وحدها تسمى:','Raw facts meaningless on their own are called:'),o:[B('بيانات','Data'),B('معلومات','Information'),B('برنامج','Program'),B('نظام تشغيل','Operating system')],a:0,e:B('البيانات تتحول إلى معلومات بعد المعالجة.','Data becomes information after processing.')},
  {q:B('الصف الواحد الذي يضم بيانات عنصر واحد في الجدول يسمى:','A single row holding all data of one item in the table is a:'),o:[B('سجل Record','Record'),B('حقل Field','Field'),B('استعلام Query','Query'),B('نموذج Form','Form')],a:0,e:B('الحقل عمود، والسجل صف.','A field is a column; a record is a row.')},
  {q:B('الحقل الذي لا تتكرر قيمته ويميّز كل سجل هو:','The field with unique values that identifies each record is the:'),o:[B('المفتاح الأساسي','Primary Key'),B('الاستعلام','Query'),B('التقرير','Report'),B('الأيقونة','Icon')],a:0,e:B('Primary Key يمنع تكرار السجلات.','The Primary Key prevents duplicate records.')},
  {q:B('العرض الذي نكتب فيه أسماء الحقول وأنواعها هو:','The view where we write field names and types is:'),o:[B('Design View','Design View'),B('Datasheet View','Datasheet View'),B('Print Preview','Print Preview'),B('Slide Show','Slide Show')],a:0,e:B('في Design View نصمم الجدول، وفي Datasheet View ندخل البيانات.','Design View is for designing; Datasheet View is for entering data.')}]},

const VID={};
function videoPlayer(host,id){
 const L=LES[id],sc=L.vid.sc,DUR=6000,TOT=sc.length*DUR;
 const st=VID[id]||(VID[id]={t:0,play:false,voice:false,last:-1});
 clearInterval(st.timer);host.style.setProperty('--c',L.c);
 host.innerHTML=`<div class="vid"><div class="stage"><span class="sc" dir="ltr"></span><span class="orb" style="width:120px;height:120px;inset-inline-start:6%;top:10%"></span><span class="orb" style="width:70px;height:70px;inset-inline-end:10%;bottom:8%;animation-delay:-3s"></span><div><div class="big"></div><h3></h3><div class="cap"></div></div></div><div class="vctl"><button class="pp">▶</button><button class="rp">↺</button><div class="vbar"><i></i></div><button class="t vo">🔊</button></div></div>
 <div class="vlink"><a class="btn sm gh" style="text-decoration:none" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodeURIComponent(LANG==='ar'?T(L.vid.q):L.vid.qe)}">▶ ${T(B('شاهد فيديوهات عن الدرس على يوتيوب','Watch more videos on YouTube'))}</a></div>`;
 const $s=s=>$(s,host);
 function speak(txt){try{speechSynthesis.cancel();if(!st.voice)return;const u=new SpeechSynthesisUtterance(txt);u.lang=LANG==='ar'?'ar-EG':'en-US';speechSynthesis.speak(u)}catch(e){}}
 function draw(){
  const i=Math.min(sc.length-1,Math.floor(st.t/DUR)),fr=(st.t-i*DUR)/DUR,s=sc[i],cap=T(s.c);
  $s('.big').textContent=s.e;$s('h3').textContent=T(s.t);
  $s('.cap').textContent=st.play?cap.slice(0,Math.ceil(cap.length*Math.min(1,fr/.55))):cap;
  $s('.sc').textContent=`${i+1} / ${sc.length}`;$s('.vbar i').style.width=(st.t/TOT*100)+'%';
  $s('.pp').textContent=st.play?'⏸':'▶';$s('.vo').style.opacity=st.voice?1:.5;
  if(st.last!==i){st.last=i;if(st.play)speak(T(s.t)+'. '+cap)}
 }
 function tick(){if(!st.play)return;st.t+=100;if(st.t>=TOT){st.t=TOT-1;st.play=false;speechSynthesis&&speechSynthesis.cancel&&speechSynthesis.cancel()}draw()}
 st.timer=setInterval(tick,100);
 $s('.pp').onclick=()=>{if(st.t>=TOT-2)st.t=0;st.play=!st.play;st.last=-1;if(!st.play)try{speechSynthesis.cancel()}catch(e){}draw()};
 $s('.rp').onclick=()=>{st.t=0;st.play=true;st.last=-1;draw()};
 $s('.vo').onclick=()=>{st.voice=!st.voice;st.last=-1;if(!st.voice)try{speechSynthesis.cancel()}catch(e){}draw()};
 $s('.vbar').onclick=e=>{const r=e.currentTarget.getBoundingClientRect();let f=(e.clientX-r.left)/r.width;if(getComputedStyle(host).direction==='rtl')f=1-f;st.t=Math.max(0,Math.min(TOT-1,f*TOT));st.last=-1;draw()};
 draw();
}

const DI=[[B('85','85'),0,B('رقم خام بلا سياق: بيانات.','A raw number with no context: data.')],[B('أحمد','Ahmed'),0,B('اسم وحده: بيانات.','A name alone: data.')],[B('درجة أحمد 85 وهي أعلى درجة في الفصل','Ahmed scored 85, the highest score in the class'),1,B('بيانات معالجة ولها معنى: معلومة.','Processed data with meaning: information.')],[B('القاهرة','Cairo'),0,B('كلمة منفردة: بيانات.','A single word: data.')],[B('3 من كل 10 طلاب يسكنون القاهرة','3 out of 10 students live in Cairo'),1,B('نتيجة معالجة البيانات: معلومة.','The result of processing data: information.')],[B('متوسط درجات الفصل 71','The class average is 71'),1,B('ناتج حساب: معلومة.','A computed result: information.')]];
function lessonView(id){
 const L=LES[id],v=$('#v-'+id);
 let html=`<span class="tag" style="--c:${L.c}">${T(B('الدرس ','Lesson '))}${L.no}</span><h1>${L.ic} ${T(L.title)}</h1><p class="sub">${T(L.sub)}</p>${goalsCard(L)}`;
 let n=1;const S=(t)=>sec(n++,t,L.c);
 html+=S(B('شاهد الفيديو','Watch the video'))+`<div id="${id}-vid"></div>`;
 html+=S(B('أهم الأفكار','Key ideas'))+`<div class="concept" style="--c:${L.c}">${L.concepts.map(c=>`<div class="card"><h3>${T(c.t)}</h3><ul>${c.l.map(x=>`<li>${T(x)}</li>`).join('')}</ul></div>`).join('')}</div>`;
 if(id==='l7')html+=S(B('جرّب اجتماعًا افتراضيًّا','Try a virtual meeting'))+`<div id="l7-meet"></div>`+S(B('تطبيقات جوجل للمشروع','Google apps for your project'))+`<div id="l7-apps"></div>`;
 if(id==='l8')html+=S(B('بيانات أم معلومات؟','Data or information?'))+`<div class="card" id="l8-di"></div>`+S(B('صمّم جدولك بنفسك (محاكي Access)','Design your own table (Access simulator)'))+`<p>${T(B('أضف حقولًا واختر نوع كل حقل وحدد المفتاح الأساسي 🔑 ثم انتقل إلى Datasheet View وأدخل سجلات.','Add fields, pick each data type, set the primary key 🔑, then go to Datasheet View and enter records.'))}</p><div class="card" id="l8-des"></div>`;
 if(id==='l9')html+=S(B('جرّب النموذج Form','Try the Form'))+`<div class="card" id="l9-form"></div>`+S(B('ابنِ استعلامك Query','Build your Query'))+`<div class="card" id="l9-qb"></div>`;
 if(id==='l10')html+=S(B('خطّط مشروعك','Plan your project'))+`<div class="card" id="l10-plan"></div>`+S(B('قيّم مشروعك','Evaluate your project'))+`<div class="card" id="l10-rub"></div>`;
 html+=S(B('نشاط الترتيب','Ordering activity'))+`<div class="card"><h3>${T(L.order.h)}</h3><div id="${id}-ord"></div></div>`;
 if(L.mini)html+=S(B('تحدٍّ سريع','Quick challenge'))+`<div class="card"><h3>${T(L.mini.h)}</h3><div id="${id}-mini"></div></div>`;
 html+=S(B('اختبر نفسك','Test yourself'))+`<div class="card" id="${id}-quiz"></div>`;
 const idx=['l7','l8','l9','l10'].indexOf(id),pv=['goals','l7','l8','l9'][idx],nx=['l8','l9','l10','exam'][idx];
 html+=`<div style="display:flex;justify-content:space-between;margin-top:30px;gap:10px;flex-wrap:wrap"><button class="btn gh" data-go="${pv}">${T(B('→ السابق','← Previous'))}</button><button class="btn" data-go="${nx}">${T(B('التالي ←','Next →'))}</button></div>`;
 v.innerHTML=html;
 videoPlayer($('#'+id+'-vid'),id);
 orderGame($('#'+id+'-ord'),L.order.steps,L.c);
 if(L.mini)quiz($('#'+id+'-mini'),L.mini.qs,{c:L.c,nofb:true});
 quiz($('#'+id+'-quiz'),L.quiz,{c:L.c,key:'q_'+id,nofb:true});
 if(id==='l7'){meetSim($('#l7-meet'));infoCards($('#l7-apps'),[
  {e:'📁',t:B('Google Drive','Google Drive'),d:B('مساحة تخزين سحابية لحفظ ملفات المشروع ومشاركتها مع الزملاء والمعلم.','Cloud storage to keep project files and share them with teammates and the teacher.')},
  {e:'📄',t:B('Google Docs','Google Docs'),d:B('كتابة التقارير والمستندات وتحريرها مع الآخرين في الوقت نفسه.','Write reports and documents and edit them together in real time.')},
  {e:'📊',t:B('Google Sheets','Google Sheets'),d:B('جداول وحسابات ورسوم بيانية لتنظيم بيانات المشروع.','Spreadsheets, calculations and charts to organize project data.')},
  {e:'🎞️',t:B('Google Slides','Google Slides'),d:B('تصميم العروض التقديمية ثم عرضها عبر Meet.','Design presentations then present them over Meet.')},
  {e:'📋',t:B('Google Forms','Google Forms'),d:B('إنشاء استبيانات واختبارات وجمع إجاباتها تلقائيًّا.','Create surveys and quizzes and collect answers automatically.')},
  {e:'📹',t:B('Google Meet','Google Meet'),d:B('اجتماعات الفريق وعرض المشروع على الجميع.','Team meetings and presenting the project to everyone.')}],L.c)}
 if(id==='l8'){
  quiz($('#l8-di'),DI.map(([t,a,e])=>({q:B('«'+t.ar+'» هو:','"'+t.en+'" is:'),o:[B('بيانات','Data'),B('معلومات','Information')],a,e})),{c:L.c,nofb:true});
  designer($('#l8-des'))}
 if(id==='l9'){formViewer($('#l9-form'));queryBuilder($('#l9-qb'))}
 if(id==='l10'){planner($('#l10-plan'));rubric($('#l10-rub'))}
}

}

 <h2 style="--c:${COL.me}"><span class="n">?</span>${T(B('اعرف أكثر','Learn more'))}</h2><div id="me-info"></div>
 <div class="card"><h3>🎯 ${T(B('عن هذه المنصة','About this platform'))}</h3><p style="margin:4px 0 0">${T(B('تغطي المنصة الدروس من السابع إلى العاشر: Google Meet وإدارة المشروع، تصميم قواعد البيانات، النماذج والاستعلامات، ومشروعك الرقمي.','The platform covers lessons 7 to 10: Google Meet and managing a project, database design, forms and queries, and your digital project.'))}</p></div>`;
 infoCards($('#me-info'),[
  {e:'📅',t:B('الفرقة الرابعة','Fourth Year'),d:B('السنة الأخيرة من مرحلة البكالوريوس.','The final year of the bachelor\'s program.')},
  {e:'💻',t:B('تكنولوجيا التعليم','Educational Technology'),d:B('قسم يهتم بتوظيف التكنولوجيا في التعليم والتعلم وإنتاج الوسائل التعليمية.','A department about using technology in teaching and learning and producing educational media.')},
  {e:'👨‍🏫',t:B('شعبة معلم حاسب','Computer Teacher'),d:B('إعداد معلم يدرّس الحاسب وتكنولوجيا المعلومات ويوظفهما في التعليم.','Preparing a teacher of computer and information technology who uses it in education.')}],COL.me);
}
